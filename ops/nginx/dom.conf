server {
    server_name dom.evtenia.ru;

    root /var/www/dom/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTTP/2 multiplexes page assets over one TLS connection. This avoids a
    # burst of handshakes and is more resilient to upstream connection limits.
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/dom.evtenia.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dom.evtenia.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name dom.evtenia.ru;
    return 301 https://$host$request_uri;
}
