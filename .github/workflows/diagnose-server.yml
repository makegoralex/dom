name: Diagnose production server

on:
  workflow_dispatch:

jobs:
  external-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public HTTPS from GitHub runner
        shell: bash
        run: |
          set -u
          failures=0
          for attempt in $(seq 1 20); do
            if result=$(curl --connect-timeout 5 --max-time 10 --silent --show-error --output /dev/null --write-out '%{http_code} %{remote_ip} %{time_connect} %{time_appconnect} %{time_total}' https://dom.evtenia.ru/); then
              echo "$attempt $result"
            else
              echo "$attempt failed"
              failures=$((failures + 1))
            fi
          done
          echo "HTTPS probe failures: $failures/20"
          test "$failures" -eq 0

  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect nginx and server health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST || 'dom.evtenia.ru' }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 2m
          command_timeout: 10m
          script_stop: true
          script: |
            set -eu
            echo '=== SYSTEM ==='
            date -u
            uptime
            free -m
            df -h /
            echo '=== NGINX SERVICE ==='
            systemctl --no-pager --full status nginx || true
            nginx -v || true
            echo '=== NGINX MAIN CONFIG ==='
            sed -n '1,240p' /etc/nginx/nginx.conf
            echo '=== DOM VIRTUAL HOST ==='
            sed -n '1,240p' /etc/nginx/sites-available/dom
            echo '=== ENABLED NGINX SITES ==='
            find /etc/nginx/sites-enabled -maxdepth 1 -mindepth 1 -printf '%f -> %l\n' | sort
            echo '=== NGINX LISTENERS AND SERVER NAMES ==='
            nginx -T 2>&1 | grep -E 'configuration file|^[[:space:]]*listen|^[[:space:]]*server_name' || true
            echo '=== PORTS 80 AND 443 ==='
            ss -ltnp | grep -E ':(80|443)[[:space:]]' || true
            ss -s || true
            ip -s link || true
            nstat -az | grep -E 'ListenDrops|ListenOverflows|TCPReqQFull|TCPSynRetrans' || true
            echo '=== FIREWALL ==='
            ufw status verbose || true
            iptables -S || true
            nft list ruleset || true
            echo '=== FAIL2BAN ==='
            systemctl is-active fail2ban || true
            fail2ban-client status || true
            echo '=== CONNECTION TRACKING ==='
            sysctl net.netfilter.nf_conntrack_count net.netfilter.nf_conntrack_max || true
            echo '=== NGINX ERRORS ==='
            tail -n 200 /var/log/nginx/error.log || true
            echo '=== RECENT NGINX LOG ==='
            journalctl -u nginx --since '24 hours ago' --no-pager | tail -n 250 || true
